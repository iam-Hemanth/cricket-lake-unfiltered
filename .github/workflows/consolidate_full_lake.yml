name: Consolidate Full 18,400+ Match Unfiltered Lake

on:
  workflow_dispatch:
  # Primary path: update_lake.yml dispatches this job as soon as it publishes
  # a delta, so the master follows the 6-hourly windows. The nightly run below
  # is a safety rebuild. Deltas are append-only, so a rebuild never loses matches.
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: consolidate-lake
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Delta Batches (iam-Hemanth/cricket-lake-unfiltered)
        run: |
          set -euo pipefail
          mkdir -p delta_archives
          mkdir -p master_all_matches
          echo "Downloading 52 delta batch archives..."
          gh release download data-unfiltered-batches -p "matches_batch_*.tar.gz" --dir delta_archives

          for arch in delta_archives/matches_batch_*.tar.gz; do
            echo "Unpacking $arch..."
            tar -xzf "$arch" -C master_all_matches
          done
          DELTA_COUNT=$(find master_all_matches -name "*.json" ! -name "failed_matches.json" | wc -l | tr -d ' ')
          echo "Unpacked $DELTA_COUNT delta matches."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Curated Lake (iam-Hemanth/cricket-extractor)
        run: |
          set -euo pipefail
          mkdir -p curated_lake
          echo "Downloading cricket_lake_v3.tar.gz from iam-Hemanth/cricket-extractor..."
          gh release download data-v2-batches --repo iam-Hemanth/cricket-extractor -p "cricket_lake_v3.tar.gz" --dir curated_lake

          echo "Unpacking curated matches into master_all_matches..."
          tar -xzf curated_lake/cricket_lake_v3.tar.gz -C master_all_matches

          TOTAL_COUNT=$(find master_all_matches -name "*.json" ! -name "failed_matches.json" ! -name "lake_manifest.json" | wc -l | tr -d ' ')
          echo "Total unique matches ready for consolidation: $TOTAL_COUNT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download 6-hourly Deltas (iam-Hemanth/cricket-lake-unfiltered)
        run: |
          set -euo pipefail
          mkdir -p delta_windows
          if gh release view data-unfiltered-deltas >/dev/null 2>&1; then
            gh release download data-unfiltered-deltas -p "lake_delta_*.tar.gz" --dir delta_windows
          fi
          shopt -s nullglob
          for arch in delta_windows/lake_delta_*.tar.gz; do
            echo "Unpacking $arch..."
            tar -xzf "$arch" -C master_all_matches
          done
          DELTA_WINDOWS=$(find delta_windows -name "lake_delta_*.tar.gz" | wc -l | tr -d ' ')
          TOTAL_COUNT=$(find master_all_matches -name "*.json" ! -name "failed_matches.json" ! -name "lake_manifest.json" | wc -l | tr -d ' ')
          echo "Folded $DELTA_WINDOWS delta windows into $TOTAL_COUNT unique matches."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Raw batch archives, the curated lake and the 6-hourly deltas are
      # snapshots from different dates. Unpacking every recovery batch last
      # lets stale re-fetches overwrite newer curated outputs; on 27 Nov that
      # quarantined 1,519 otherwise-valid matches. Only ids listed under
      # corrections/ are authoritative, and they are re-applied on every
      # rebuild so a correction survives the next full consolidation.
      - name: Re-apply correction overlays last
        run: |
          set -euo pipefail
          shopt -s nullglob
          overlays=(corrections/*.json)
          archives=(delta_archives/matches_batch_recovery_*.tar.gz)
          if [ "${#overlays[@]}" -eq 0 ]; then
            echo "No correction overlays."
            exit 0
          fi
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for arch in "${archives[@]}"; do
            echo "Staging $arch..."
            tar -xzf "$arch" -C "$tmp"
          done
          python - "$tmp" "${overlays[@]}" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          stage = Path(sys.argv[1])
          ids = []
          for name in sys.argv[2:]:
              data = json.loads(Path(name).read_text())
              ids.extend(data['ids'] if isinstance(data, dict) else data)

          dest = Path('master_all_matches')
          applied, missing = [], []
          for match_id in sorted(set(ids)):
              source = stage / f'{match_id}.json'
              if source.is_file():
                  shutil.copy2(source, dest / f'{match_id}.json')
                  applied.append(match_id)
              else:
                  missing.append(match_id)
          print(f'Applied {len(applied)} correction(s); missing {len(missing)}')
          if missing:
              raise SystemExit('missing correction ids: ' + ', '.join(missing))
          PY
          TOTAL_COUNT=$(find master_all_matches -name "*.json" ! -name "failed_matches.json" ! -name "lake_manifest.json" | wc -l | tr -d ' ')
          echo "Master now holds $TOTAL_COUNT unique matches."

      - name: Apply ESPN stage index
        run: |
          set -euo pipefail
          mkdir -p stage_index
          if gh release view data-unfiltered-batches >/dev/null 2>&1 \
             && gh release download data-unfiltered-batches -p "stage_index_*.json.gz" --dir stage_index 2>/dev/null; then
            shopt -s nullglob
            indexes=(stage_index/stage_index_*.json.gz)
            if [ "${#indexes[@]}" -gt 0 ]; then
              INDEX=$(printf '%s\n' "${indexes[@]}" | sort | tail -1)
              python scripts/apply_stage_index.py --matches-dir master_all_matches --index "$INDEX"
            else
              echo "No stage index asset; keeping constructor-derived stage fields."
            fi
          else
            echo "No stage index asset; keeping constructor-derived stage fields."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Consolidate Master Lake & Generate Manifest
        run: |
          # --published-only keeps the manifest in sync with the catalog: the
          # public archives exclude quarantined matches, so they must not be
          # counted in total_matches/deliveries either.
          python consolidate.py \
            --input-dirs master_all_matches \
            --output-dir master_unfiltered_lake/matches \
            --manifest-path master_unfiltered_lake/lake_manifest.json \
            --published-only

      - name: Build Index Catalog & Distribution Archives
        run: |
          python scripts/build_lake_catalog.py \
            --matches-dir master_unfiltered_lake/matches \
            --output-dir master_unfiltered_lake/dist \
            --archive-prefix cricket_lake_unfiltered_master

      - name: Display Lake Summary
        run: |
          cat master_unfiltered_lake/lake_manifest.json
          echo "### 🏏 Unfiltered Master Cricket Data Lake Summary (published matches)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat master_unfiltered_lake/lake_manifest.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Master Unfiltered Lake Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-unfiltered-master
          files: |
            master_unfiltered_lake/dist/cricket_lake_unfiltered_master.zip
            master_unfiltered_lake/dist/cricket_lake_unfiltered_master.tar.gz
            master_unfiltered_lake/dist/matches_index.csv
            master_unfiltered_lake/dist/README.txt
            master_unfiltered_lake/lake_manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger download catalog rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run build_downloads.yml
          echo "Queued build_downloads.yml after master rebuild"
