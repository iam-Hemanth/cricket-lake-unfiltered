name: Update lake (6-hourly)

# Why this workflow exists:
#   The three existing workflows are all `workflow_dispatch` only, so nothing
#   has ever run automatically. This one owns the recurring path:
#     discover -> extract only what is new -> publish a delta -> record state
#
# Design notes:
#   * cron runs at :00 every 6 hours; GitHub may delay by a few minutes.
#   * discovery is idempotent: it diffs against the known-id set, so a delayed,
#     duplicated or manual run never double-extracts.
#   * extraction is chunked so a large backlog fans out instead of timing out.
#   * publishing is a single job -> no matrix jobs racing on the same release tag.
#   * the state commit keeps the repo active, which stops GitHub from disabling
#     this schedule after 60 days of inactivity.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Override start date (YYYY-MM-DD). Defaults to last successful run.'
        required: false
        default: ''
      max_matches:
        description: 'Hard cap on matches for this run (backlog control)'
        required: false
        default: '400'
      dry_run:
        description: 'Discover only, do not extract'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-lake
  cancel-in-progress: false

env:
  STATE_TAG: lake-state
  DELTA_TAG: data-unfiltered-deltas
  PYTHONUNBUFFERED: '1'

jobs:
  # ---------------------------------------------------------------- discover
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_new: ${{ steps.plan.outputs.has_new }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      since: ${{ steps.plan.outputs.since }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state (last run date + known ids)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .state
          if gh release view "$STATE_TAG" >/dev/null 2>&1; then
            gh release download "$STATE_TAG" -p 'lake_state.json' --dir .state --clobber || true
            gh release download "$STATE_TAG" -p 'known_ids.json'  --dir .state --clobber || true
          else
            echo "No state release yet - first run will use the published index."
          fi
          ls -la .state || true

      - name: Fetch published match index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The index is the authoritative "what is already in the lake" list.
          gh release download data-unfiltered-master -p 'matches_index.csv' \
            --dir .state --clobber 2>/dev/null || echo "::warning::matches_index.csv unavailable - relying on known_ids.json only"

      - name: Resolve start date
        id: since
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.since }}"
          if [ -n "$INPUT" ]; then
            echo "value=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f .state/lake_state.json ]; then
            # 2-day overlap absorbs late scorecard corrections and timezone skew
            echo "value=$(python3 -c "import json,datetime as d; s=json.load(open('.state/lake_state.json')); print((d.date.fromisoformat(s['last_success_utc'][:10])-d.timedelta(days=2)).isoformat())")" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u -d '7 days ago' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover new matches
        id: discover
        run: |
          set -euo pipefail
          python scripts/discover_delta.py \
            --since "${{ steps.since.outputs.value }}" \
            --known-index .state/matches_index.csv \
            --known-ids .state/known_ids.json \
            --output data/manifest_delta.json \
            --summary data/discovery_summary.json

      - name: Plan extraction chunks
        id: plan
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          cap = int(os.environ.get("MAX_MATCHES") or 400)
          manifest = json.load(open("data/manifest_delta.json"))
          summary = json.load(open("data/discovery_summary.json"))
          if not manifest:
              print("nothing new to extract")
              open(os.environ["GITHUB_OUTPUT"], "a").write("has_new=false\ncount=0\nmatrix=[]\n")
              raise SystemExit(0)
          if len(manifest) > cap:
              print(f"capping {len(manifest)} -> {cap} (backlog carried to next run)")
              manifest = manifest[:cap]
              json.dump(manifest, open("data/manifest_delta.json", "w"), indent=2)
          size = 40
          chunks = math.ceil(len(manifest) / size)
          matrix = [{"chunk": i, "size": size} for i in range(chunks)]
          print(f"new={len(manifest)} chunks={chunks}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("has_new=true\n")
              fh.write(f"count={len(manifest)}\n")
              fh.write(f"matrix={json.dumps(matrix)}\n")
          PY
        env:
          MAX_MATCHES: ${{ github.event.inputs.max_matches || '400' }}

      - name: Upload delta manifest
        if: steps.plan.outputs.has_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-delta
          path: |
            data/manifest_delta.json
            data/discovery_summary.json
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "### Discovery"
            echo '```json'
            cat data/discovery_summary.json || echo '{}'
            echo '```'
            echo "Planned: ${{ steps.plan.outputs.count }} matches across ${{ steps.plan.outputs.matrix }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- extract
  extract:
    needs: discover
    if: needs.discover.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: manifest-delta
          path: data

      - name: Extract chunk ${{ matrix.chunk.chunk }}
        env:
          AKAMAI_KEY: ${{ secrets.AKAMAI_KEY }}
        run: |
          set -euo pipefail
          OUT="out/chunk_${{ matrix.chunk.chunk }}"
          RAW="raw/chunk_${{ matrix.chunk.chunk }}"
          mkdir -p "$OUT" "$RAW"
          python extract.py \
            --manifest data/manifest_delta.json \
            --batch-index ${{ matrix.chunk.chunk }} \
            --batch-size ${{ matrix.chunk.size }} \
            --delay 0.25 \
            --output-dir "$OUT" \
            --raw-dir "$RAW"

      - name: Pack parsed output
        if: always()
        run: |
          set -euo pipefail
          D="out/chunk_${{ matrix.chunk.chunk }}"
          mkdir -p "$D"
          tar -czf "matches_chunk_${{ matrix.chunk.chunk }}.tar.gz" \
              --exclude=failed_matches.json -C "$D" .

      - name: Upload parsed chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matches-chunk-${{ matrix.chunk.chunk }}
          path: matches_chunk_${{ matrix.chunk.chunk }}.tar.gz
          retention-days: 30

      - name: Upload failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-chunk-${{ matrix.chunk.chunk }}
          path: out/chunk_${{ matrix.chunk.chunk }}/failed_matches.json
          if-no-files-found: ignore
          retention-days: 30

  # ----------------------------------------------------------------- publish
  publish:
    needs: [discover, extract]
    # Publish whatever landed, even if one chunk failed; partial data is still data.
    if: always() && needs.discover.outputs.has_new == 'true' && needs.extract.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect chunks
        uses: actions/download-artifact@v4
        with:
          pattern: matches-chunk-*
          merge-multiple: true
          path: chunks

      - name: Collect delta manifest
        uses: actions/download-artifact@v4
        with:
          name: manifest-delta
          path: data

      - name: Merge delta
        run: |
          set -euo pipefail
          mkdir -p merged/raw
          shopt -s nullglob
          for t in chunks/*.tar.gz; do
            echo "unpacking $t"
            tar -xzf "$t" -C merged/raw
          done
          COUNT=$(find merged/raw -name '*.json' ! -name 'failed_matches.json' | wc -l | tr -d ' ')
          echo "delta matches: $COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "::warning::no matches extracted this window"; fi
          STAMP=$(date -u +%Y%m%dT%H)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "COUNT=$COUNT" >> "$GITHUB_ENV"
          tar -czf "lake_delta_${STAMP}.tar.gz" -C merged/raw .
          sha256sum "lake_delta_${STAMP}.tar.gz" | tee checksums.txt

      - name: Publish delta asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$DELTA_TAG" >/dev/null 2>&1 || \
            gh release create "$DELTA_TAG" --title "Lake deltas (6-hourly)" \
              --notes "Append-only delta windows produced by update_lake.yml." --latest=false
          gh release upload "$DELTA_TAG" \
            "lake_delta_${STAMP}.tar.gz" checksums.txt data/manifest_delta.json --clobber

      - name: Update state (known ids + last success)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .state
          gh release download "$STATE_TAG" -p 'known_ids.json' --dir .state --clobber 2>/dev/null || true
          gh release download "$STATE_TAG" -p 'lake_state.json' --dir .state --clobber 2>/dev/null || true
          python - <<'PY'
          import json, os
          known = set()
          if os.path.exists(".state/known_ids.json"):
              known = set(map(str, json.load(open(".state/known_ids.json"))))
          delta = json.load(open("data/manifest_delta.json"))
          known.update(str(m["match_id"]) for m in delta)
          json.dump(sorted(known), open(".state/known_ids.json", "w"))
          state = {}
          if os.path.exists(".state/lake_state.json"):
              state = json.load(open(".state/lake_state.json"))
          state.update({
              "last_success_utc": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "last_delta_count": len(delta),
              "known_ids": len(known),
              "last_delta_asset": os.environ["STAMP"],
          })
          json.dump(state, open(".state/lake_state.json", "w"), indent=2)
          print(json.dumps(state, indent=2))
          PY
          gh release view "$STATE_TAG" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" --title "Pipeline state" \
              --notes "Machine state for update_lake.yml. Do not delete." --latest=false
          gh release upload "$STATE_TAG" .state/known_ids.json .state/lake_state.json --clobber

      - name: Prune delta assets older than 30 days
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%dT%H)
          gh release view "$DELTA_TAG" --json assets --jq '.assets[].name' \
            | grep -E '^lake_delta_[0-9]{8}T[0-9]{2}\.tar\.gz$' \
            | while read -r a; do
                ts=${a#lake_delta_}; ts=${ts%.tar.gz}
                if [[ "$ts" < "$CUTOFF" ]]; then gh release delete-asset "$DELTA_TAG" "$a" -y; fi
              done

  # ------------------------------------------------------------------ notify
  notify-failure:
    needs: [discover, extract, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Lake update failed';
            const body = `Scheduled run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed at ${new Date().toISOString()}.`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pipeline'
            });
            if (issues.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline']
              });
            }
