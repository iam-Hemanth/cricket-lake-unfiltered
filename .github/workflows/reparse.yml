name: Reparse

# Rebuild the lake from the raw payloads, without touching the network.
#
# This is the correct response to a parser bug. The raw payload of every
# fetch is stored, so a parser change is applied offline by rebuilding from
# those payloads. Re-fetching from ESPN to fix a parser bug would risk
# losing data for no benefit.

on:
  workflow_dispatch:
    inputs:
      match_ids:
        description: "Comma-separated match ids to rebuild (blank for the stale ones)"
        required: false
        type: string
      force_all:
        description: "Rebuild every published match, not only the stale ones"
        required: false
        type: boolean
      limit:
        description: "Maximum matches to rebuild"
        required: false
        type: number
      dry_run:
        description: "Report what would be rebuilt and stop"
        required: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: reparse
  cancel-in-progress: false

jobs:
  reparse:
    name: Rebuild
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.reparse.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild the matches
        id: reparse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATCH_IDS: ${{ inputs.match_ids }}
          FORCE_ALL: ${{ inputs.force_all && '1' || '' }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "$FORCE_ALL" ]; then EXTRA="$EXTRA --force"; fi
          if [ -n "$LIMIT" ]; then EXTRA="$EXTRA --limit $LIMIT"; fi
          if [ -n "$DRY_RUN" ]; then
            EXTRA="$EXTRA --dry-run"
          else
            EXTRA="$EXTRA --upload"
          fi
          python scripts/pipeline_reparse.py \
            --workdir reparse_work \
            --repo ${{ github.repository }} \
            --match-ids "$MATCH_IDS" \
            $EXTRA \
            | tee reparse_summary.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          summary = json.load(open("reparse_summary.json"))
          print(f"has_changes={'true' if summary.get('has_changes') else 'false'}")
          PY

  dispatch_publish:
    name: Publish the rebuilt snapshot
    needs: reparse
    if: ${{ needs.reparse.outputs.has_changes == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the publish workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --repo ${{ github.repository }}
