name: Seed lake state (one-off)

# Temporary branch workflow: repairs the pre-fix state where publish marked
# planned-but-failed matches as known, then dispatches one update run.
# It is idempotent: if there is nothing stranded, it does nothing.

on:
  push:
    branches:
      - fix/update-pipeline

permissions:
  contents: write
  actions: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile known ids with published delta contents
        id: seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .state published published_matches
          if gh release view lake-state >/dev/null 2>&1; then
            gh release download lake-state --dir .state --clobber
          fi
          gh release download data-unfiltered-deltas -p 'lake_delta_*.tar.gz' --dir published --clobber
          shopt -s nullglob
          for arch in published/*.tar.gz; do
            tar -xzf "$arch" -C published_matches
          done
          python - <<'PY'
          import glob, json, os
          from datetime import datetime, timezone

          def load(path, default):
              return json.load(open(path)) if os.path.exists(path) else default

          known = set(map(str, load('.state/known_ids.json', [])))
          published = {
              os.path.basename(p)[:-5]
              for p in glob.glob('published_matches/*.json')
              if not p.endswith('failed_matches.json')
          }
          stranded = sorted(known - published)
          print(f"known={len(known)} published={len(published)} stranded={len(stranded)}")
          print("stranded ids:", ",".join(stranded))
          if not stranded:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write('seeded=0\n')
              raise SystemExit(0)

          known &= published
          json.dump(sorted(known), open('.state/known_ids.json', 'w'))

          state = load('.state/lake_state.json', {})
          retry = dict(state.get('retry') or {})
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          for mid in stranded:
              retry.setdefault(mid, {
                  'attempts': 0,
                  'first_seen': now,
                  'last_error': 'stranded by pre-fix state bug (planned match marked known)',
                  'manifest': {'match_id': mid},
              })
          state['retry'] = retry
          state['known_ids'] = len(known)
          state['retry_count'] = len(retry)
          state['state_repaired_utc'] = now
          json.dump(state, open('.state/lake_state.json', 'w'), indent=2)
          print(json.dumps({k: v for k, v in state.items() if k != 'retry'}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('seeded=1\n')
          PY
          gh release upload lake-state .state/known_ids.json .state/lake_state.json --clobber

      - name: Dispatch update run
        if: steps.seed.outputs.seeded == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_lake.yml --ref "${GITHUB_REF_NAME}"
          sleep 5
          gh run list --workflow=update_lake.yml --branch "${GITHUB_REF_NAME}" --limit 3
