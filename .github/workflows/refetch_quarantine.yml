name: Re-fetch quarantined matches

# Re-downloads the still-quarantined matches from the source in parallel
# chunks and re-runs the production extractor. This distinguishes two very
# different cases:
#   * the original parse was truncated / drifted  -> the new file validates
#   * the source itself is incomplete             -> the new file still fails
#
# Only files that pass the current validator are published as
# matches_batch_refetch_<stamp>_c<n>.tar.gz assets on data-unfiltered-batches.
#
# The source batch is never edited: matches that still fail stay quarantined
# in matches_batch_recovery_*.tar.gz. The merge job publishes one
# refetch-results artifact containing every still-failing file, which
# apply_source_gap.yml consumes.

on:
  workflow_dispatch:
    inputs:
      source_asset:
        description: 'Batch asset containing the quarantined matches'
        required: true
        default: 'matches_batch_recovery_20261025.tar.gz'
      publish:
        description: 'Upload the passing refetch batches to data-unfiltered-batches'
        type: boolean
        default: true
      delay:
        description: 'Base delay between source requests (seconds)'
        required: true
        default: '0.15'

permissions:
  contents: write

concurrency:
  group: refetch-quarantine
  cancel-in-progress: false

env:
  BATCH_TAG: data-unfiltered-batches

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download source batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p recovered/matches
          gh release download "$BATCH_TAG" \
            -p "${{ github.event.inputs.source_asset }}" \
            --dir recovered --clobber
          tar -xzf "recovered/${{ github.event.inputs.source_asset }}" -C recovered/matches
          echo "source files: $(find recovered/matches -name '*.json' | wc -l)"

      - name: List quarantined ids
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          ids = []
          for p in sorted(pathlib.Path('recovered/matches').glob('*.json')):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue
              if (data.get('meta') or {}).get('validation_status') == 'failed':
                  ids.append(p.stem)
          pathlib.Path('quarantine_ids.txt').write_text('\n'.join(ids) + ('\n' if ids else ''))
          print(f'quarantined ids: {len(ids)}')
          if not ids:
              raise SystemExit('no quarantined matches in this batch')
          PY

      - name: Re-fetch chunk ${{ matrix.chunk }} from source
        env:
          AKAMAI_KEY: ${{ secrets.AKAMAI_KEY }}
        run: |
          set -euo pipefail
          mkdir -p refetched raw
          python extract.py \
            --ids-file quarantine_ids.txt \
            --chunk-index ${{ matrix.chunk }} \
            --chunk-size 150 \
            --output-dir refetched \
            --raw-dir raw \
            --delay "${{ github.event.inputs.delay }}" \
            --allow-validation-failures

      - name: Split passing and still-failing files
        run: |
          set -euo pipefail
          mkdir -p pass fail
          python - <<'PY'
          import json, pathlib, shutil, collections
          passed = 0
          failed = 0
          reasons = collections.Counter()
          for p in sorted(pathlib.Path('refetched').glob('*.json')):
              if p.name == 'failed_matches.json':
                  continue
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  reasons['unreadable'] += 1
                  shutil.copy2(p, pathlib.Path('fail') / p.name)
                  failed += 1
                  continue
              if (data.get('meta') or {}).get('validation_status') == 'failed':
                  errs = (data.get('meta') or {}).get('validation_errors') or []
                  for e in errs[:1]:
                      key = e.split(':')[0].split(' at ')[0]
                      if key.startswith('Inn '):
                          key = 'over-length'
                      reasons[key] += 1
                  shutil.copy2(p, pathlib.Path('fail') / p.name)
                  failed += 1
              else:
                  shutil.copy2(p, pathlib.Path('pass') / p.name)
                  passed += 1
          summary = {'chunk': ${{ matrix.chunk }}, 'passed': passed, 'failed': failed,
                     'first_error_kinds': dict(reasons.most_common(15))}
          pathlib.Path('refetch_summary_c${{ matrix.chunk }}.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Package passing chunk
        id: package
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(pass/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "asset=" >> "$GITHUB_OUTPUT"
            echo "no passing matches in this chunk"
            exit 0
          fi
          stamp="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          asset="matches_batch_refetch_${stamp}_c${{ matrix.chunk }}.tar.gz"
          tar -czf "$asset" -C pass .
          sha256sum "$asset" | tee "${asset}.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload passing chunk
        if: ${{ github.event.inputs.publish == 'true' && steps.package.outputs.asset != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$BATCH_TAG" "${{ steps.package.outputs.asset }}" --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refetch-chunk-${{ matrix.chunk }}
          path: |
            refetch_summary_c${{ matrix.chunk }}.json
            quarantine_ids.txt
            fail/
            matches_batch_refetch_*.tar.gz
            pass/
          if-no-files-found: ignore
          retention-days: 30

  merge:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect chunk results
        uses: actions/download-artifact@v4
        with:
          pattern: refetch-chunk-*
          merge-multiple: true
          path: chunks

      - name: Merge failure sets and summaries
        run: |
          set -euo pipefail
          mkdir -p fail
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('chunks')
          summaries = []
          total_pass = total_fail = 0
          for p in sorted(root.glob('refetch_summary_c*.json')):
              s = json.loads(p.read_text())
              summaries.append(s)
              total_pass += s['passed']
              total_fail += s['failed']
          fail_src = root / 'fail'
          if fail_src.is_dir():
              for f in fail_src.glob('*.json'):
                  shutil.copy2(f, pathlib.Path('fail') / f.name)
          ids = sorted(root.glob('quarantine_ids.txt'))
          if ids:
              shutil.copy2(ids[0], 'quarantine_ids.txt')
          summary = {'passed': total_pass, 'failed': total_fail,
                     'chunks': summaries,
                     'merged_fail_files': len(list(pathlib.Path('fail').glob('*.json')))}
          pathlib.Path('refetch_summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps({k: summary[k] for k in ('passed', 'failed', 'merged_fail_files')}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: refetch-results
          path: |
            refetch_summary.json
            quarantine_ids.txt
            fail/
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Quarantine re-fetch (parallel)"
            echo '```json'
            cat refetch_summary.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
